# 业务站点域名示例：app.example.com。与 Flow 面板使用独立域名。
# 发布目标在面板中填写 /srv/sites/demo，Nginx 指向其 current 子目录。
server {
    listen 80;
    server_name app.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name app.example.com;

    ssl_certificate /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;

    root /srv/sites/demo/current;
    index index.html;

    location / {
        # Vue/React 等 SPA 的 history 路由回退到入口文件。
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
