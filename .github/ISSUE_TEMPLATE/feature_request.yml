name: 功能建议
description: 提出使用场景和改进建议
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 目前遇到了什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的功能
      description: 描述期望的行为，以及目前使用的替代方案。
    validations:
      required: true
